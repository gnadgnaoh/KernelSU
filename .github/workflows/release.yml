name: Release
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: ""
      release_notes:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave blank to auto-generate from sync-state)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" && "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          fi
          if [[ -z "$tag" ]]; then
            tag="v3.3.1-mojito-$(date -u +%Y%m%d)-${GITHUB_SHA:0:8}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: true
          files: |
            manager/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
